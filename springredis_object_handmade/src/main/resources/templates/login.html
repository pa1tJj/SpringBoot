<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>LOGIN</title>
</head>
<body>
	<form th:action="@{/do-login}" method="POST" th:object="${user}">
		<p>username:<input type="text" th:field="*{username}"></p>
		<p>password:<input type="password" th:field="*{password}"></p>
		<button>login</button>
	</form>
</body>
</html>
