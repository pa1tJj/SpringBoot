<!DOCTYPE html >
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<form th:action="@{/products-edit}" th:object="${productRes}"
		method="POST">
		<div>
			<label for="id">id</label> <input type="text" name="id" id="id"
				th:field="*{id}">
		</div>
		<div>
			<label for="name">name</label> <input type="text" name="name"
				id="name" th:field="*{name}">
		</div>
		<div>
			<label for="price">price</label> <input type="text" name="price"
				id="price" th:field="*{price}">
		</div>

		<div>
			<label for="cate">category:</label> 
			<select name="cate" id="cate" >
				<option th:each="item : ${categories}" th:text="${item.name}"  th:value="${item.id}"></option>
			</select>
		</div>

		<span th:if="${productRes.id} != null">
			<button type="submit">sửa</button>
		</span> <span th:unless="${productRes.id}">
			<button type="submit">thêm</button>
		</span>
	</form>

</body>
</html>
