<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danh Sách Phim | My Rule</title>
<style>
.btn-detail {
	display: block;
	text-align: center;
	background: linear-gradient(to right, #f7a1c4, #f6bcd1);
	color: white;
	font-weight: 600;
	border-radius: 8px;
	padding: 9px 0;
	margin-top: 10px;
	text-decoration: none;
	transition: 0.3s;
	letter-spacing: 0.5px;
}

.btn-detail:hover {
	background: linear-gradient(to right, #f48fb1, #f6a5c0);
	box-shadow: 0 4px 12px rgba(244, 143, 177, 0.4);
	transform: translateY(-2px);
}

a {
	text-decoration: none;
	color: black;
}
/* Reset & base style */
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
	font-family: 'Segoe UI', 'Poppins', sans-serif;
}

body {
	background: linear-gradient(to bottom right, #fff0f6, #ffe4ec);
	padding: 40px 80px;
	color: #444;
	min-height: 100vh;
}
/* Header */
header {
	text-align: center;
	margin-bottom: 50px;
	animation: fadeInDown 1s ease;
}

header h1 {
	color: #d84d8b;
	font-size: 2.4em;
	margin-bottom: 10px;
	text-shadow: 0 2px 8px rgba(255, 182, 193, 0.5);
}

header p {
	color: #8c6270;
	font-size: 16px;
	letter-spacing: 0.5px;
}
/* Filter Bar */
.filter-bar {
	display: flex;
	justify-content: center;
	flex-wrap: wrap;
	gap: 15px;
	margin-top: 25px;
	animation: fadeIn 1.2s ease;
}

.search-box input, .genre-select {
	padding: 10px 18px;
	border: 2px solid #f5a5c0;
	border-radius: 25px;
	outline: none;
	font-size: 15px;
	background-color: #fff;
	color: #444;
	box-shadow: 0 3px 10px rgba(255, 182, 193, 0.3);
	transition: 0.3s;
}

.search-box input:focus, .genre-select:focus {
	border-color: #f48fb1;
	box-shadow: 0 6px 15px rgba(244, 143, 177, 0.4);
}

.genre-select {
	cursor: pointer;
}
/* Movie Grid */
.movie-list {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
	gap: 35px;
	margin-top: 30px;
	animation: fadeIn 1.4s ease;
}
/* Movie Card */
.movie-card {
	background-color: #fff;
	border-radius: 18px;
	box-shadow: 0 4px 15px rgba(255, 182, 193, 0.4);
	overflow: hidden;
	transition: transform 0.35s ease, box-shadow 0.35s ease;
	position: relative;
}

.movie-card:hover {
	transform: translateY(-10px);
	box-shadow: 0 8px 25px rgba(255, 182, 193, 0.5);
}

.movie-card img {
	width: 100%;
	height: 340px;
	object-fit: cover;
	border-bottom: 1px solid #ffd6e6;
}
/* Overlay effect */
.movie-card::before {
	content: "";
	position: absolute;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	background: linear-gradient(to top, rgba(255, 192, 203, 0.25),
		rgba(255, 255, 255, 0));
	opacity: 0;
	transition: 0.3s;
}

.movie-card:hover::before {
	opacity: 1;
}
/* Movie Info */
.movie-info {
	padding: 15px 20px;
	text-align: left;
}

.movie-info h3 {
	font-size: 18px;
	color: #c93b7c;
	margin-bottom: 6px;
}

.movie-info p {
	font-size: 14px;
	color: #666;
	margin-bottom: 4px;
}

.movie-info p span {
	font-weight: 600;
	color: #b8477a;
}
/* Animation */
keyframes fadeIn {from { opacity:0;
	transform: translateY(15px);
}

to {
	opacity: 1;
	transform: translateY(0);
}

}
keyframes fadeInDown {from { opacity:0;
	transform: translateY(-20px);
}

to {
	opacity: 1;
	transform: translateY(0);
}

}
/* Responsive */
@media ( max-width : 768px) {
	body {
		padding: 30px 20px;
	}
	header h1 {
		font-size: 1.8em;
	}
	.movie-card img {
		height: 280px;
	}
}
/* Pagination */
.pagination {
	display: flex;
	justify-content: center;
	align-items: center;
	gap: 10px;
	margin-top: 50px;
	flex-wrap: wrap;
}

.page-numbers {
	display: flex;
	gap: 6px;
}

.page-btn {
	border: none;
	font-weight: 600;
	cursor: pointer;
	transition: all 0.3s ease;
	box-shadow: 0 3px 8px rgba(255, 182, 193, 0.4);
}

.nav-btn {
	background: linear-gradient(to right, #f7a1c4, #f6bcd1);
	color: white;
	padding: 8px 14px;
	border-radius: 25px;
}

.num-btn {
	background: white;
	color: #c93b7c;
	border: 2px solid #f6bcd1;
	border-radius: 50%;
	width: 38px;
	height: 38px;
	font-size: 15px;
}

.num-btn:hover {
	background: #fce4ec;
	transform: translateY(-2px);
}

.page-btn.active {
	background: linear-gradient(to right, #e75480, #f58ca9);
	color: white;
	border: none;
	transform: scale(1.05);
}

.page-btn:disabled {
	opacity: 0.5;
	cursor: not-allowed;
}

</style>
</head>
<body>

	<header>
		<h1>🌸 My Rule 🌸</h1>
		<p>Những bộ phim ngọt ngào, nhẹ nhàng như hoa anh đào Nhật Bản</p>

		<!-- Thanh tìm kiếm + thể loại -->
		<form method="GET" th:action="@{/phangxxx/movist}"
			th:object="${search}">
			<div class="filter-bar">
				<div class="search-box">
					<input type="text" th:field="*{name}" th:value="*{name}"
						placeholder="🔍 Tìm kiếm phim...">
				</div>
				<select id="genreSelect" class="genre-select" th:field="*{genreId}">
					<option th:value="0">🎞️ Tất cả thể loại</option>
					<option th:each="item : ${genre}" th:value="${item.id}"
						th:text="${item.name}">💖 Tình cảm</option>
				</select>
			</div>
		</form>
	</header>
	<nav style="position: absolute; top: 20px; right: 40px;" th:object="${auth}">
		<p th:if="${auth} == null">
			<a th:href="@{/phang-admin/login}"
				style="background: linear-gradient(to right, #f7a1c4, #f6bcd1); padding: 8px 16px; border-radius: 25px; color: white; font-weight: 600; text-decoration: none; transition: 0.3s;">
				🔐 Đăng nhập </a>
		</p>
		<p th:if="${auth} != null">
			<a th:href="@{/phang-admin/login}" th:text="${auth.fullname}"
				style="background: linear-gradient(to right, #f7a1c4, #f6bcd1); padding: 8px 16px; border-radius: 25px; color: white; font-weight: 600; text-decoration: none; transition: 0.3s;">
				🔐 Đăng nhập </a>
		</p>
	</nav>

	<!-- Danh sách phim -->
	<section class="movie-list" id="movieList">
		<div th:each="item : ${movies.getList()}">
			<a th:href="@{/phangxxx/movie-details/{id}(id=${item.id})}"
				class="movie-card" th:attr="data-genre=${item.genre.name}"> <img
				th:src="@{'/images/' + ${item.image}}" alt="Ảnh phim">
				<div class="movie-info">
					<h3 th:text="${item.name}">Tên phim</h3>
					<p>
						🎭 <span th:text="${item.genre.name}">Thể loại</span>
					</p>
					<p>
						🎬 Diễn viên: <span th:text="${item.actor}">Tên diễn viên</span>
					</p>
					<span class="btn-detail">Xem chi tiết</span>
				</div>
			</a>
		</div>
	</section>

	<form th:action="@{/phangxxx/movist}" method="get" class="pagination">
		<button class="page-btn nav-btn">&laquo; Trước</button>
		<div class="page-numbers">
			<span th:each="num : ${#numbers.sequence(1, movies.getTotal())}">
				<button type="submit" name="page" th:text="${num}" th:value="${num}" class="page-btn num-btn"></button>
			</span>
		</div>
		<button class="page-btn nav-btn">Sau &raquo;</button>
	</form>
</body>
</html>
